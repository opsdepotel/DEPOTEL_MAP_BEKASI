<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 65" width="260" height="65">
  <defs>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="textDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1" flood-color="#1e293b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Clean white background pill -->
  <rect width="260" height="65" rx="10" fill="#ffffff"/>
  
  <!-- 3 Red/Orange Swooshes -->
  <g id="swoosh-group">
    <path d="M 44 12 C 28 12, 16 20, 14 29 C 21 20, 33 15, 44 12 Z" fill="url(#swooshGrad)" opacity="0.85"/>
    <path d="M 52 23 C 25 20, 10 33, 6 44 C 17 29, 38 23, 52 23 Z" fill="url(#swooshGrad)" opacity="0.92"/>
    <path d="M 58 34 C 21 29, 4 44, 2 57 C 13 40, 38 31, 58 34 Z" fill="url(#swooshGrad)"/>
  </g>
  
  <!-- DEPOTEL Text -->
  <text x="68" y="46" font-family="'Arial Black', 'Helvetica Neue', system-ui, sans-serif" font-weight="900" font-style="italic" font-size="38" letter-spacing="1" fill="#1e3a8a" filter="url(#textDropShadow)">DEPOTEL</text>
</svg>
